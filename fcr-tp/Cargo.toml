[package]
name = "fcr-tp"
version = "0.1.0"
edition = "2021"
description = "FCR Transport Protocol: Adaptive, Zero-Plaintext, and ASI-Resilient wrapper for FCR-RSA"

[dependencies]
bytes = "1.5"
# FIX: feature benar "derive", bukan "zeroize_derive"
zeroize = { version = "1.7", features = ["derive"] }
rand = "0.8"
chacha20poly1305 = "0.10"
sha2 = "0.10"
# HKDF TIDAK di sini: HKDF milik FCR-RSA (fcr-core-rust). FCR-TP hanya
# menerima kunci sesi hasil HKDF, tidak menderivasi sendiri. Lihat
# INTEGRATION_CONTRACT.md dan FcrTpSession::from_session_key().
serde = { version = "1.0", features = ["derive"], optional = true }
# FIX: defense.rs::to_json() memakai serde_json, sebelumnya tidak dideklarasikan
serde_json = { version = "1.0", optional = true }
# fcr-core-rust DIHAPUS sementara: tidak ada file .rs yang memakainya.
# Tambahkan lagi hanya saat bridge benar-benar memanggilnya, dengan path
# yang sudah diverifikasi (relatif terhadap lokasi crate ini).

[features]
default = []
serde = ["dep:serde", "dep:serde_json"]

[dev-dependencies]
tokio = { version = "1.35", features = ["full"] }