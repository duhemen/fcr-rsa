[package]
name = "fcr-tp"
version = "0.1.0"
edition = "2021"
description = "FCR Transport Protocol: Adaptive, Zero-Plaintext, and ASI-Resilient wrapper for FCR-RSA"

[dependencies]
bytes = "1.5"
zeroize = { version = "1.7", features = ["zeroize_derive"] }
fcr-core-rust = { path = "../fcr-core-rust" }
rand = "0.8"

# TAMBAHKAN INI:
chacha20poly1305 = "0.10"  # AEAD encryption
sha2 = "0.10"              # Untuk key derivation

[dev-dependencies]
tokio = { version = "1.35", features = ["full"] }