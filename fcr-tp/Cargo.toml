[package]
name = "fcr-tp"
version = "0.1.0"
edition = "2021"
description = "FCR Transport Protocol: Adaptive, Zero-Plaintext, and ASI-Resilient wrapper for FCR-RSA"

[dependencies]
bytes = "1.5"
zeroize = { version = "1.7", features = ["zeroize_derive"] }
fcr-core-rust = { path = "../fcr-core-rust" }
rand = "0.8"
chacha20poly1305 = "0.10"
sha2 = "0.10"

# ✅ OPTIONAL: serde untuk TechnicalDetails (kompatibel dengan fcr-engine REST API)
serde = { version = "1.0", features = ["derive"], optional = true }

[features]
default = []
# Aktifkan dengan: cargo build --features serde
serde = ["dep:serde"]

[dev-dependencies]
tokio = { version = "1.35", features = ["full"] }