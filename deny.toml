# Konfigurasi cargo-deny untuk FCR-RSA

[advisories]
version = 2
yanked = "warn"
unmatched = "allow"
ignore = [
    "RUSTSEC-2024-0436", # paste (dev-dependency macro)
    "RUSTSEC-2026-0543", # chrono (informational unmaintained)
    "RUSTSEC-2026-0459", # libsqlite3-sys (compile-time sqlx-macros only, unused at runtime)
    "RUSTSEC-2023-0071", # rsa 0.9.10 (compile-time sqlx-macros mysql driver only, unused at runtime)
]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
]
confidence-threshold = 0.8
unused-allowed-license = "allow"

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]


