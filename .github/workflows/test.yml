name: FCR-RSA Full Test Suite

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # ============================================================
  # 1. RUST CORE (Lint, Format, Unit & Integration Tests)
  # ============================================================
  rust-core:
    name: Rust Core Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fcr-core-rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Run all Rust tests
        run: cargo test --all-targets

  # ============================================================
  # 2. PYTHON PURE & EXAMPLES
  # ============================================================
  python-core:
    name: Python Reference Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fcr-python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -e . pytest
      - name: Run pytest
        run: pytest tests/ -v
      - name: Run basic example
        run: python examples/basic.py

  # ============================================================
  # 3. PYO3 RUST-PYTHON BINDINGS & DIFFERENTIAL GATE
  # ============================================================
  pyo3-and-gates:
    name: PyO3 Bindings & Equivalence Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build & Install fcr-pyo3 via Maturin
        working-directory: fcr-pyo3
        run: |
          pip install maturin pytest
          maturin develop --release
          if [ -f "test_pyo3.py" ]; then python test_pyo3.py; fi
      - name: Run Differential Equivalence Gate (Lean <-> Python <-> Rust)
        run: |
          GATE_SCRIPT=$(find . -name "*equivalence*gate*.py" -o -name "*differential*.py" | head -n 1)
          if [ -n "$GATE_SCRIPT" ]; then
            echo "Menjalankan $GATE_SCRIPT..."
            python "$GATE_SCRIPT"
          fi

  # ============================================================
  # 4. QUANTUM SIMULATIONS (Qiskit QFT Blinding & Grover Oracle)
  # ============================================================
  quantum-simulations:
    name: Quantum Simulations (QFT & Grover)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Qiskit & Scientific Stack
        run: pip install numpy matplotlib qiskit qiskit-aer
      - name: Run Quantum Blinding & Grover Scripts
        run: |
          for script in $(find simulations -name "*.py" | sort); do
            echo "🚀 Menjalankan simulasi: $script"
            python "$script"
          done

  # ============================================================
  # 5. BRUTAL TEST SUITE (45 Audit-Grade Assertions)
  # ============================================================
  brutal-suite:
    name: Engine Brutal Test Suite (45 Assertions)
    runs-on: ubuntu-latest
    needs: [rust-core, pyo3-and-gates]
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: fcr_ci_password
          POSTGRES_DB: fcr_rsa
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Python Test Dependencies
        run: pip install aiohttp asyncpg psycopg2-binary requests
      - name: Build FCR-Engine Release Binary
        working-directory: fcr-engine
        run: cargo build --release
      - name: Run Database Migrations & Seed Initial Key
        env:
          DATABASE_URL: "postgresql://postgres:fcr_ci_password@localhost:5432/fcr_rsa"
        run: |
          psql "$DATABASE_URL" -f fcr-engine/migrations/001_init.sql
          cd fcr-engine
          ./target/release/fcr-engine keygen -N "test-key-1" -s "brutal-ci-seed"
      - name: Start Server & Execute 45 Brutal Assertions
        env:
          DATABASE_URL: "postgresql://postgres:fcr_ci_password@localhost:5432/fcr_rsa"
        run: |
          cd fcr-engine
          ./target/release/fcr-engine serve &
          SERVER_PID=$!
          for i in {1..30}; do
            if curl -s http://localhost:8080/health > /dev/null; then
              echo "✅ Server siap pada detik ke-${i}"
              break
            fi
            sleep 1
          done
          python test_brutal_suite.py
          EXIT_CODE=$?
          kill $SERVER_PID || true
          exit $EXIT_CODE
