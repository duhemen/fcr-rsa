name: FCR-RSA Verification Gate

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # ============================================================
  # 1. Formal Verification (Lean 4)
  # ============================================================
  formal-verification:
    name: Lean 4 Theorem Proving
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install elan (Lean toolchain manager)
        run: |
          curl https://elan.lean-lang.org/elan-init.sh -sSf | sh -s -- -y --default-toolchain leanprover/lean4:v4.36.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Build Formal Proofs with Lake
        working-directory: formal-verification
        run: |
          echo "🔍 Mengunduh dependensi std4 dan memverifikasi teorema..."
          lake update
          lake build
          echo "✅ Lean 4 proofs verified successfully!"

  # ============================================================
  # 2. Rust Differential Equivalence Test
  # ============================================================
  rust-equivalence:
    name: Rust Equivalence Test
    runs-on: ubuntu-latest
    needs: formal-verification
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Run Blinding Equivalence Test
        run: |
          echo "🧪 Menjalankan 1000 vektor uji Lean ↔ Rust..."
          cd fcr-core-rust
          cargo test --test blinding_equivalence -- --nocapture
          echo "✅ Rust Equivalence Test Passed"

  # ============================================================
  # 3. Brutal Test Suite (45 Assertions)
  # ============================================================
    brutal-suite:
    name: Brutal Test Suite (45 Assertions)
    runs-on: ubuntu-latest
    needs: rust-equivalence
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: Bp2jk@kalteng123
          POSTGRES_DB: fcr_rsa
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Create Virtual Environment & Install Dependencies
        run: |
          python -m venv .venv
          source .venv/bin/activate
          pip install --upgrade pip
          pip install aiohttp asyncpg psycopg2-binary requests
          echo "✅ Python venv ready"

      - name: Build Engine Release Binary
        run: |
          cd fcr-engine
          cargo build --release

      # ✅ LANGKAH BARU: Jalankan Migrasi Database
      - name: Run Database Migrations
        env:
          DATABASE_URL: "postgresql://postgres:Bp2jk%40kalteng123@localhost:5432/fcr_rsa"
        run: |
          echo "🗄️  Menjalankan migrasi database schema..."
          psql "$DATABASE_URL" -f fcr-engine/migrations/001_init.sql
          echo "✅ Database schema siap"

      - name: Run Server & Brutal Test Suite
        env:
          DATABASE_URL: "postgresql://postgres:Bp2jk%40kalteng123@localhost:5432/fcr_rsa"
        run: |
          source .venv/bin/activate
          
          echo "🚀 Memulai FCR-Engine Server..."
          cd fcr-engine
          
          DATABASE_URL=$DATABASE_URL ./target/release/fcr-engine serve &
          SERVER_PID=$!
          
          echo "⏳ Menunggu server siap..."
          for i in {1..30}; do
            if curl -s http://localhost:8080/health > /dev/null; then
              echo "✅ Server siap setelah ${i} detik"
              break
            fi
            sleep 1
          done
          
          echo "🔥 Menjalankan Brutal Test Suite (45 Assertions)..."
          DATABASE_URL=$DATABASE_URL python test_brutal_suite.py
          TEST_EXIT=$?
          
          kill $SERVER_PID || true
          
          if [ $TEST_EXIT -ne 0 ]; then
            echo "❌ Brutal Test Suite GAGAL"
            exit 1
          fi
          echo "✅ Brutal Test Suite Selesai (45/45 PASS)"