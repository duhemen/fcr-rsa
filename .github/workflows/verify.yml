name: FCR-RSA Verification Gate

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # ============================================================
  # 1. Formal Verification (Lean 4)
  # ============================================================
  formal-verification:
    name: Lean 4 Theorem Proving
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Lean 4
        uses: leanprover/lean-action@v1
        with:
          lean-version: "4.36.0"
          
      - name: Verify Formal Theorems
        run: |
          echo "🔍 Memverifikasi Teorema Lean 4..."
          # Pastikan file ada dan tidak ada error/warning
          lean formal-verification/FcrConstantTime.lean
          echo "✅ Lean 4 Proof Verified (0 Problems)"

  # ============================================================
  # 2. Rust Differential Equivalence Test
  # ============================================================
  rust-equivalence:
    name: Rust Equivalence Test
    runs-on: ubuntu-latest
    needs: formal-verification
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        
      - name: Run Blinding Equivalence Test
        run: |
          echo "🧪 Menjalankan 1000 vektor uji Lean ↔ Rust..."
          cd fcr-core-rust
          cargo test --test blinding_equivalence -- --nocapture
          echo "✅ Rust Equivalence Test Passed"

  # ============================================================
  # 3. Brutal Test Suite (Integration & Stress)
  # ============================================================
  brutal-suite:
    name: Brutal Test Suite (45 Assertions)
    runs-on: ubuntu-latest
    needs: rust-equivalence
    
    # Setup PostgreSQL Service
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: Bp2jk@kalteng123
          POSTGRES_DB: fcr_rsa
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install aiohttp asyncpg psycopg2-binary
          
      - name: Build Engine Release Binary
        run: |
          cd fcr-engine
          cargo build --release
          
      - name: Run Server & Brutal Test Suite
        env:
          # URL Encoded: @ menjadi %40
          DATABASE_URL: "postgresql://postgres:Bp2jk%40kalteng123@localhost:5432/fcr_rsa"
        run: |
          echo "🚀 Memulai FCR-Engine Server..."
          cd fcr-engine
          
          # Jalankan biner rilis langsung di background (lebih cepat dari cargo run)
          DATABASE_URL=$DATABASE_URL ./target/release/fcr-engine serve &
          SERVER_PID=$!
          
          # Tunggu server siap menerima koneksi
          echo "⏳ Menunggu server siap (10 detik)..."
          sleep 10 
          
          echo "🔥 Menjalankan Brutal Test Suite..."
          DATABASE_URL=$DATABASE_URL python test_brutal_suite.py
          
          # Matikan server setelah tes selesai
          kill $SERVER_PID
          echo "✅ Brutal Test Suite Selesai"