[package]
name = "fcr-core-rust"
version = "0.6.1"
edition = "2021"

[lib]
name = "fcr_core_rust"
path = "src/lib.rs"

[dependencies]
# Core cryptography (v0.6.1 architecture)
crypto-bigint = "0.7.6"
hkdf = "0.12"
sha2 = "0.10"
rand = "0.8"
rand_core = "0.6"

# Dipertahankan sementara untuk red_team.rs (akan di-refactor di masa depan)
num-bigint = "0.4"
num-traits = "0.2"

[dev-dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
statrs = "0.16"
