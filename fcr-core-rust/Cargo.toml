[package]
name = "fcr-core-rust"
version = "0.6.0"
edition = "2021"

[lib]
name = "fcr_core_rust"
path = "src/lib.rs"

[dependencies]
# num-bigint & num-traits dipertahankan sementara untuk src/red_team.rs
num-bigint = "0.4"
num-traits = "0.2"
rand = "0.8"
rand_core = "0.6"
crypto-bigint = { version = "0.5", features = ["rand_core", "alloc"] }
hkdf = "0.12"
sha2 = "0.10"
statrs = "0.16"

[dev-dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
