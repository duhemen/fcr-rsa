[package]
name = "fcr-engine"
version = "0.1.0"
edition = "2021"

[dependencies]
# Link ke core library yang sudah di-hardening (v0.6.0)
fcr-core-rust = { path = "../fcr-core-rust" }
fcr-tp = { path = "../fcr-tp" }

# CLI & Async Runtime
clap = { version = "4.4", features = ["derive"] }
tokio = { version = "1.35", features = ["full"] }
dotenvy = "0.15"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Database
sqlx = { version = "0.8", default-features = false, features = ["postgres", "runtime-tokio", "chrono", "tls-rustls"] }
chrono = { version = "0.4", features = ["serde"] }

# REST API
axum = "0.7"
tower-http = { version = "0.5", features = ["cors", "trace"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Kriptografi & Utilitas
# Kriptografi & Utilitas (samakan dengan fcr-core-rust v0.7.11)
crypto-bigint = { version = "0.7.11", features = ["rand_core", "alloc"] }
hkdf = "0.12"
sha2 = "0.10"
chacha20poly1305 = "0.10"
base64 = "0.21"
rand = "0.8"
hmac = "0.12"
hex = "0.4"